<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1330"><title>Koçluk Takibi</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e1330;--c1:#171d47;--c2:#212963;--tx:#f2f4ff;--mu:#9aa2d6;--ac:#7c5cff;--ok:#2dd4a0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 80% -10%,#2a2f8a55,transparent),var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 90px}
#app{max-width:1000px;margin:auto;padding:16px}
h1{font-size:26px;font-weight:800}h2{font-size:18px;margin-bottom:10px}.m{color:var(--mu);font-size:13px}
.card{background:linear-gradient(160deg,var(--c1),var(--c2));border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid #ffffff14}
.st{cursor:pointer;display:flex;gap:12px;align-items:center;border-left:6px solid var(--k)}.st:active{transform:scale(.98)}
.av{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--k)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.pill{background:#ffffff14;border-radius:99px;padding:5px 11px;font-size:13px}
button,input,select,textarea{font:inherit;color:var(--tx);background:#ffffff14;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px}
input,select,textarea{flex:1;min-width:80px}textarea{width:100%}
button{cursor:pointer;font-weight:700}button.p{background:var(--ac);border:0}button.d,.x{color:#ff8a8a}.x{cursor:pointer}
.bn{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#0e1330ee;backdrop-filter:blur(10px)}
.bn button{flex:1;max-width:220px}.bn .on{background:var(--ac);border:0}
.t{display:flex;gap:8px;align-items:center;padding:10px;border-radius:14px;background:#ffffff0d;margin-bottom:8px}.t.ok{background:#2dd4a022}
.n{width:78px;flex:none;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}.stats b{display:block;font-size:22px}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06231a;font-weight:800;padding:10px 18px;border-radius:99px;display:none;z-index:99}
[hidden]{display:none!important}
</style></head><body><div id="app"></div><div id="toast"></div><input type="file" id="imp" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),K='kocTakipV2',COL=['#7c5cff','#00c9a7','#ff7a59','#ffc233','#3ea6ff','#ff5c9d'],EMO=['🦊','🐼','🦁','🐯','🦄','🐙'],DT=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{students:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shift=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const WS=d=>shift(d,-((new Date(d+'T12:00').getDay()+6)%7)),wd=w=>[0,1,2,3,4,5,6].map(i=>shift(w,i));
const fd=d=>new Date(d+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'short'}),wl=w=>fd(w)+' – '+fd(shift(w,6));
const st=id=>S.students.find(s=>s.id==id);
let V={tab:'panel',sid:null,all:false,w:WS(today())};
function norm(){S.rule=S.rule||{pm:.1,att:5,tm:10};S.rule.pp=S.rule.pp??5;S.subj=S.subj||['Matematik','Geometri','Fizik','Kimya','Biyoloji','Türkçe','Edebiyat','Tarih','Coğrafya','İngilizce'];S.students.forEach(s=>{s.tasks=s.tasks||[];s.plan=s.plan||[];s.logs=s.logs||{};s.exams=s.exams||[];s.wn=s.wn||{};s.plan.forEach(p=>{p.mx=p.mx??S.rule.pp;if(p.got===undefined)p.got=null;p.done=!!p.done})})}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2400)}
function ask(title,fs,cb){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="card" style="width:min(420px,92vw);margin:0"><h2>${title}</h2>${fs.map((f,i)=>`<p class="m">${f[1]}</p><input id="q${i}" value="${esc(f[2])}" style="width:100%;margin-bottom:10px">`).join('')}<div class="row sp"><button id="qn">Vazgeç</button><button id="qy" class="p">Tamam</button></div></div>`;document.body.appendChild(o);const c=()=>o.remove(),ok=()=>{const v=fs.map((_,i)=>o.querySelector('#q'+i).value.trim());c();cb(v)};o.querySelector('#qn').onclick=c;o.querySelector('#qy').onclick=ok;o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')ok()});const f=o.querySelector('input');f&&f.focus()}
/* puan hesapları */
function sc(s,w){const D=wd(w),tk=s.tasks.filter(t=>t.w==w),pl=s.plan.filter(p=>p.w==w),L=D.map(d=>s.logs[d]||{}),tp=tk.reduce((a,t)=>a+(t.got||0),0),tm=tk.reduce((a,t)=>a+t.mx,0),pp=pl.reduce((a,p)=>a+(p.got||0),0),pmx=pl.reduce((a,p)=>a+(p.mx||0),0),min=L.reduce((a,l)=>a+(l.min||0),0),att=L.filter(l=>l.att).length,bo=L.reduce((a,l)=>a+(+l.bonus||0),0);return{tp,tm,pp,pmx,pn:pl.length,pdn:pl.filter(p=>p.done).length,min,att,bo,tot:tp+pp+att*S.rule.att+Math.round(min*S.rule.pm)+bo,n:tk.length,dn:tk.filter(t=>t.got!=null).length}}
const allW=s=>[...new Set([...s.tasks.map(t=>t.w),...Object.keys(s.logs).map(WS)])];
const gen=s=>allW(s).reduce((a,w)=>a+sc(s,w).tot,0),val=s=>V.all?gen(s):sc(s,V.w).tot;
const dif=(s,w)=>Math.round(sc(s,w).tot-sc(s,shift(w,-7)).tot);
const arr=d=>d>0?`<span style="color:#22c55e">▲ ${d}</span>`:d<0?`<span style="color:#ef4444">▼ ${-d}</span>`:'<span class="m">–</span>';
/* grafikler (hem ekranda hem PDF'te) */
const bars=(v,lb,col,c,pl)=>{const m=Math.max(10,...v),g=280/v.length;return v.map((x,i)=>{const h=x/m*62,cl=!pl&&i&&x>v[i-1]?'#22c55e':!pl&&i&&x<v[i-1]?'#ef4444':col;return `<rect x="${i*g+g*.15}" y="${78-h}" width="${g*.7}" height="${Math.max(h,2)}" rx="4" fill="${cl}"/><text x="${i*g+g/2}" y="${72-h}" text-anchor="middle" font-size="9" fill="${c}">${Math.round(x)}</text><text x="${i*g+g/2}" y="96" text-anchor="middle" font-size="8" fill="${c}">${lb[i]}</text>`}).join('')};
const line=(e,col,c)=>{if(e.length<2)return `<text x="10" y="50" font-size="10" fill="${c}">Grafik için en az 2 deneme gerekli</text>`;const p=e.map((x,i)=>[20+i*240/(e.length-1),90-x.sc/x.mx*75]);return `<polyline fill="none" stroke="${col}" stroke-width="3" points="${p.map(a=>a.join(',')).join(' ')}"/>`+p.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="${col}"/><text x="${a[0]}" y="${a[1]-8}" text-anchor="middle" font-size="9" fill="${c}">${Math.round(e[i].sc/e[i].mx*100)}</text>`).join('')};
const sv=f=>`<svg viewBox="0 0 280 105" width="100%">${f}</svg>`;
const trend=(s,w)=>{const tr=[...Array(8)].map((_,i)=>shift(w,-7*(7-i)));return[tr.map(x=>sc(s,x).tot),tr.map(x=>x.slice(8)+'.'+x.slice(5,7))]};
/* ekranlar */
const wnav=()=>`<div class="card row sp" style="padding:8px"><button onclick="V.w=shift(V.w,-7);R()">‹</button><b>${wl(V.w)}</b><button onclick="V.w=WS(today());R()">Bu hafta</button><button onclick="V.w=shift(V.w,7);R()">›</button></div>`;
function R(){norm();$('#app').innerHTML=(V.tab=='set'?settings():V.sid&&st(V.sid)?detail(st(V.sid)):panel())+`<nav class="bn">${[['panel','🏠 Panel'],['set','⚙️ Ayarlar']].map(x=>`<button class="${V.tab==x[0]?'on':''}" onclick="V.tab='${x[0]}';V.sid=null;R()">${x[1]}</button>`).join('')}</nav>`}
function panel(){const r=[...S.students].sort((a,b)=>val(b)-val(a));return `<div class="row sp"><div><img src="icon-192.png" alt="" width="46" height="46" style="border-radius:12px;margin-right:10px;float:left"><h1>Koçluk Takibi</h1><p class="m">${V.all?'Genel sıralama (tüm zamanlar)':'Haftalık sıralama'}</p></div><button class="p" onclick="addS()">+ Öğrenci</button></div><br>${V.all?'':wnav()}<div class="row" style="margin-bottom:14px"><button onclick="V.all=!V.all;R()">${V.all?'Haftalık göster':'Genel göster'}</button><button onclick="allTask()">➕ Herkese görev</button><button onclick="pdf('rank','dl')">⬇ Sıralama PDF</button></div>`+(r.length?r.map((s,i)=>{const c=sc(s,V.w);return `<div class="card st" style="--k:${s.color}" onclick="V.sid='${s.id}';R()"><div style="font-size:24px;width:34px;text-align:center">${['🥇','🥈','🥉'][i]||i+1}</div><div class="av">${s.emoji}</div><div style="flex:1"><b style="font-size:18px">${esc(s.name)}</b><div class="m">${V.all?'Tüm haftalar toplamı':`Görev ${c.dn}/${c.n} · Program ${c.pdn}/${c.pn} · Devam ${c.att} gün · ${c.min} dk`}</div></div><div style="text-align:right"><b style="font-size:26px">${Math.round(val(s))}</b><div>${V.all?'':arr(dif(s,V.w))}</div></div></div>`}).join(''):'<div class="card"><h2>Başlayalım</h2><p class="m">"+ Öğrenci" ile öğrencileri ekle. Her hafta için program ve görev ver, puanla, PDF olarak paylaş.</p></div>')}
function detail(s){const w=V.w,c=sc(s,w),D=wd(w),rk=[...S.students].sort((a,b)=>sc(b,w).tot-sc(a,w).tot).indexOf(s)+1,[tv,tl]=trend(s,w),tk=s.tasks.filter(t=>t.w==w),I=(id,ph)=>`<input id="${id}" placeholder="${ph}">`;
return `<div class="row sp"><button onclick="V.sid=null;R()">← Geri</button><div class="row"><button onclick="editS()">✏️ Düzenle</button><button class="d" onclick="delS()">🗑️</button></div></div><br><div class="row"><div class="av" style="--k:${s.color}">${s.emoji}</div><div><h1>${esc(s.name)}</h1><p class="m">🎯 ${esc(s.goal)||'Hedef yok (Düzenle)'}</p></div></div><br>${wnav()}
<div class="card stats"><div><b>${Math.round(c.tot)}</b><span class="m">Toplam puan</span></div><div><b>${rk}. / ${S.students.length}</b><span class="m">Sıra</span></div><div><b>${arr(dif(s,w))}</b><span class="m">Geçen haftaya göre</span></div><div><b>${c.pdn}/${c.pn}</b><span class="m">Program yapıldı</span></div><div><b>${c.pp}/${c.pmx}</b><span class="m">Program puanı</span></div><div><b>${c.dn}/${c.n}</b><span class="m">Görev</span></div><div><b>${c.att} gün</b><span class="m">Devam</span></div><div><b>${c.min} dk</b><span class="m">Çalışma</span></div></div>
<div class="row" style="margin-bottom:14px"><button class="p" onclick="pdf('eval','dl')">⬇ Değerlendirme PDF</button><button class="p" onclick="pdf('plan','dl')">⬇ Program PDF</button><button onclick="pdf('eval','pv')">👁 Önizle / Paylaş</button></div>
<div class="card"><h2>🗓️ Haftalık ders çalışma programı</h2>${DT.map((n,i)=>{const l=s.plan.filter(p=>p.w==w&&p.d==i);return l.length?`<div style="margin-bottom:12px"><div style="color:${DC[i]};font-weight:800;margin-bottom:6px">${n} · ${fd(D[i])} <span class="m">(${l.filter(p=>p.done).length}/${l.length} yapıldı)</span></div>${l.map(p=>`<div class="t ${p.done?'ok':''}" style="border-left:4px solid ${DC[i]}"><button class="${p.done?'p':''}" style="min-width:46px" onclick="tgP('${p.id}')">${p.done?'✓':'○'}</button><span style="flex:1" onclick="editP('${p.id}')"><b>${esc(p.s)}</b> <i class="m">${p.m?p.m+' dk':''}</i></span><input class="n" type="number" step="0.5" min="0" max="${p.mx}" value="${p.got??''}" placeholder="–" onchange="setPG('${p.id}',this.value)"><span class="m">/${p.mx}</span><button onclick="editP('${p.id}')">✎</button><button class="d" onclick="delP('${p.id}')">✕</button></div>`).join('')}</div>`:''}).join('')||'<p class="m">Bu hafta için program yok.</p>'}
<p class="m" style="margin-top:10px">Ders eklemek için: gün(ler)i seç, dersi seç veya yaz, süre ve puanı gir. ○ yapıldı işaretler (tam puan verir), puan kutusundan farklı puan yazabilirsin, ✎ düzenler.</p><div class="row" style="margin:8px 0">${DT.map((n,i)=>`<button class="${(V.pd||[]).includes(i)?'p':''}" onclick="tgD(${i},this)">${n}</button>`).join('')}</div><div class="row" style="margin-bottom:8px">${chips('ps')}</div><div class="row"><input id="ps" list="dl" placeholder="Ders / konu"><input id="pm" type="number" class="n" placeholder="dk"><input id="px" type="number" class="n" value="${S.rule.pp}"><button class="p" onclick="addP()">Ekle</button></div><datalist id="dl">${S.subj.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><br><button onclick="copyPrev()">⤴ Geçen haftayı kopyala (program + görev)</button></div>
<div class="card"><h2>✅ Haftalık görevler ve puanlar</h2>${tk.map(t=>`<div class="t ${t.got!=null?'ok':''}"><span style="flex:1"><b>${esc(t.s)}</b> ${esc(t.t)}</span><input class="n" type="number" step="0.5" min="0" max="${t.mx}" value="${t.got??''}" placeholder="–" onchange="setGot('${t.id}',this.value)"><span class="m">/${t.mx}</span><button onclick="setGot('${t.id}',${t.mx})">✓</button><button class="d" onclick="delT('${t.id}')">✕</button></div>`).join('')||'<p class="m">Görev yok.</p>'}<div class="row" style="margin-bottom:8px">${chips('ts')}</div><div class="row"><input id="ts" list="dl" placeholder="Ders"><input id="tt" placeholder="Görev (ör. 40 soru)" style="flex:2"><input id="tx" type="number" class="n" value="${S.rule.tm}"><button class="p" onclick="addT(0)">Ekle</button></div><p class="m" style="margin-top:6px">Kutuya verdiğin puanı yaz, ✓ tam puan verir. Boş = henüz değerlendirilmedi.</p><button style="margin-top:8px" onclick="addT(1)">Herkese ekle</button></div>
<div class="card"><h2>📆 Devam ve çalışma süresi</h2>${D.map((d,i)=>{const l=s.logs[d]||{};return `<div class="t"><b style="width:46px">${DT[i]}</b><button class="${l.att?'p':''}" onclick="att('${d}')">${l.att?'✓ Devam':'Devam yok'}</button><input class="n" type="number" placeholder="dk" value="${l.min||''}" onchange="setL('${d}','min',this.value)"><input class="n" type="number" placeholder="+puan" value="${l.bonus||''}" onchange="setL('${d}','bonus',this.value)"></div>`}).join('')}<p class="m">Sırayla: devam, çalışılan dakika, ekstra bonus puan.</p></div>
<div class="card"><h2>📈 Haftalık puan trendi</h2>${sv(bars(tv,tl,s.color,'#cfd3ff'))}<p class="m">Yeşil: yükseliş, kırmızı: düşüş (önceki haftaya göre)</p></div>
<div class="card"><h2>📝 Denemeler (%)</h2>${sv(line(s.exams.slice(-8),s.color,'#cfd3ff'))}${s.exams.map((e,i)=>`<div class="t"><span style="flex:1">${esc(e.n)} <span class="m">${fd(e.d)}</span></span><b>${e.sc}/${e.mx}</b>${i?arr(Math.round(e.sc/e.mx*100-s.exams[i-1].sc/s.exams[i-1].mx*100)):''}<button class="d" onclick="dx('${e.id}')">✕</button></div>`).reverse().join('')}<div class="row"><input id="en" placeholder="Deneme adı"><input id="es" type="number" class="n" placeholder="Puan"><input id="em" type="number" class="n" value="100"><button class="p" onclick="addE()">Ekle</button></div></div>
<div class="card"><h2>💬 Haftalık değerlendirme notu</h2><textarea rows="4" placeholder="Bu hafta neler iyi gitti, neler geliştirilecek? (PDF'e eklenir)" onchange="s_wn(this.value)">${esc(s.wn[w]||'')}</textarea></div>`}
function settings(){return `<h1>Ayarlar</h1><br><div class="card"><h2>Puan kuralları</h2><p class="m">Dakika başına ${S.rule.pm} puan · Devam günü ${S.rule.att} puan · Görev varsayılanı ${S.rule.tm} puan · Program dersi ${S.rule.pp} puan</p><br><button class="p" onclick="rules()">Kuralları değiştir</button></div><div class="card"><h2>Ders listesi</h2><p class="m">Program ve görev eklerken bu dersler hazır düğme olarak çıkar.</p><br><div class="row">${S.subj.map((x,i)=>`<span class="pill">${esc(x)} <a class="x" onclick="S.subj.splice(${i},1);save();R()">✕</a></span>`).join('')}</div><br><div class="row"><input id="nsub" placeholder="Yeni ders"><button class="p" onclick="newSub($('#nsub').value);save();R()">Ekle</button></div></div><div class="card"><h2>Yedekle / Geri yükle</h2><p class="m">Veriler bu cihazda saklanır. Düzenli yedek al.</p><br><div class="row"><button class="p" onclick="exp()">Yedeği indir</button><button onclick="$('#imp').click()">Yedeği yükle</button><button class="d" onclick="ask('Tüm veriler silinsin mi?',[],()=>{S={students:[]};save();R()})">Hepsini sil</button></div></div>`}
/* işlemler */
function addS(){ask('Yeni öğrenci',[['n','Öğrenci adı','']],v=>{if(!v[0])return;const i=S.students.length;S.students.push({id:uid(),name:v[0],emoji:EMO[i%6],color:COL[i%6],goal:''});save();R()})}
function editS(){const s=st(V.sid);ask('Öğrenciyi düzenle',[['n','Ad',s.name],['g','Hedef (ör. TYT 400 net)',s.goal],['e','Emoji',s.emoji]],v=>{s.name=v[0]||s.name;s.goal=v[1];if(v[2])s.emoji=v[2];save();R()})}
function delS(){const s=st(V.sid);ask('"'+esc(s.name)+'" silinsin mi? Tüm verisi gider.',[],()=>{S.students=S.students.filter(x=>x!=s);V.sid=null;save();R()})}
function rules(){ask('Puan kuralları',[['a','Dakika başına puan (ör. 0.1)',S.rule.pm],['b','Devam günü puanı',S.rule.att],['c','Görev varsayılan puanı',S.rule.tm],['d','Program dersi varsayılan puanı',S.rule.pp]],v=>{S.rule={pm:parseFloat(v[0].replace(',','.'))||0,att:+v[1]||0,tm:+v[2]||10,pp:v[3]===''?5:+v[3]||0};save();R()})}
const chips=id=>S.subj.map(x=>`<button class="pill" style="border:1px solid #ffffff22" onclick="pick('${id}',this)">${esc(x)}</button>`).join('');
const pick=(id,b)=>{$('#'+id).value=b.textContent};
function tgD(i,b){V.pd=V.pd||[];const k=V.pd.indexOf(i);k<0?V.pd.push(i):V.pd.splice(k,1);b.classList.toggle('p')}
function newSub(x){x=(x||'').trim();if(x&&!S.subj.some(y=>y.toLowerCase()==x.toLowerCase()))S.subj.push(x)}
function addP(){const s=st(V.sid),x=$('#ps').value.trim();if(!x)return toast('Ders seç veya yaz');if(!(V.pd||[]).length)return toast('Gün seç');newSub(x);V.pd.forEach(d=>s.plan.push({id:uid(),w:V.w,d,s:x,m:+$('#pm').value||0,mx:+$('#px').value||0,got:null,done:false}));save();R()}
function tgP(id){const p=st(V.sid).plan.find(x=>x.id==id);p.done=!p.done;if(p.done){if(p.got==null)p.got=p.mx;toast('✓ Yapıldı')}else p.got=null;save();R()}
